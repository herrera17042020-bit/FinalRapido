<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120C09">
<meta name="robots" content="noindex">
<title>El Rápido · Mi tarjeta y catálogo</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/portal.css">
<style>html, body { margin: 0; min-height: 100%; background: #120C09; } #portal { min-height: 100vh; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }</style>
</head>
<body>
<!--
  Página PÚBLICA del cliente. Es el enlace que abre el chip NFC / QR del local
  (o el botón "Mi Tarjeta de Fidelidad" de Beacons). No da acceso al panel:
  solo muestra el catálogo y, con teléfono + placa, la tarjeta de lealtad del cliente.
  En el prototipo usa los mismos datos de demostración que el panel (data.js).
  En producción, api.js consultará /api/publico/* en el servidor.
-->
<div id="portal"></div>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/portal.js"></script>
<script>
  const vista = new URLSearchParams(location.search).get("v");   // ?v=lealtad abre directo la tarjeta
  PORTAL.montar(document.getElementById("portal"), { modo: "publico" }).iniciar({ vista: ["catalogo", "extras", "lealtad"].includes(vista) ? vista : "inicio" });
</script>
</body>
</html>
